<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#6B7280" stroke-width="2"/>
  <!-- Trajectory -->
  <path d="M 150 500 Q 450 100 750 500" stroke="#3B82F6" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
  <!-- Ball -->
  <circle cx="450" cy="200" r="16" fill="#EF4444"/>
  <!-- Velocity arrow -->
  <line x1="450" y1="200" x2="520" y2="160" stroke="#059669" stroke-width="3"/>
  <polygon points="520,160 510,168 516,172" fill="#059669"/>
  <!-- Title -->
  <text x="600" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="#111827">Fizzix - Projectile Motion</text>
  <text x="600" y="595" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#4B5563">Free Physics Lab for Class 6-12 Students</text>
  <!-- Brand -->
  <rect x="30" y="30" width="50" height="50" rx="10" fill="#2563EB"/>
  <text x="55" y="62" text-anchor="middle" font-size="24" fill="white">&#x269B;</text>
  <text x="95" y="55" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Fizzix</text>
</svg>
